<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RP2354A Flight Controller</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #dfdfe2; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<!-- Nothing but the board, for screen recording. Drag rotates, scroll zooms, right-drag pans.
     Keys: space starts/stops the spin, 1 angled view, 2 top, 3 bottom. -->
<canvas id="view" aria-label="Interactive 3D model of the RP2354A flight controller board"></canvas>
<script id="meta" type="application/json">__META__</script>
<img id="data" alt="" hidden src="__SRC__">
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

try {
  const canvas = document.getElementById("view");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  // Look copied from balancio-board/scripts/render_3d.py (JLCPCB black solder mask):
  //  - the mask is a neutral black, 88 % opaque, so copper shows through as a slightly lighter black;
  //  - copper is recoloured light grey first: orange copper under black mask reads brown;
  //  - the board core is dark, so only copper reads through the mask;
  //  - the surroundings light the scene dimly (a glossy black lit by a bright backdrop turns grey),
  //    while the backdrop the camera sees stays light.
  const LOOK = { mask: [0.012, 0.012, 0.014], maskOpacity: 0.88, maskRoughness: 0.35, core: [0.05, 0.045, 0.035],
                 copper: [0.6, 0.56, 0.5], copperRoughness: 0.3, pad: "#d4a843", silk: "#f5f5f0", surroundings: 0.25 };
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.setClearColor("#dfdfe2", 1);

  const scene = new THREE.Scene();
  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.03).texture;
  for (const [x, y, z, power] of [[0.4, 1.0, 0.5, 3.0], [-0.3, -1.0, -0.4, 2.0]]) {  // key light and one from below
    const sun = new THREE.DirectionalLight(0xffffff, power);
    sun.position.set(x, y, z);
    scene.add(sun);
  }

  const meta = JSON.parse(document.getElementById("meta").textContent);
  // the mesh bytes are stored as the RGB pixel values of a PNG
  const img = document.getElementById("data");
  await img.decode();
  const bmp = await createImageBitmap(img, { colorSpaceConversion: "none", premultiplyAlpha: "none" });
  const ctx = new OffscreenCanvas(bmp.width, bmp.height).getContext("2d", { willReadFrequently: true });
  ctx.drawImage(bmp, 0, 0);
  const px = ctx.getImageData(0, 0, bmp.width, bmp.height).data;
  const bytes = new Uint8Array(meta.bytes);
  for (let i = 0, p = 0; i < bytes.length; p += 4) { bytes[i++] = px[p]; bytes[i++] = px[p + 1]; bytes[i++] = px[p + 2]; }
  const size = meta.hi.map((h, k) => h - meta.lo[k]);
  const board = new THREE.Group();
  for (const m of meta.meshes) {
    const q = new Uint16Array(bytes.buffer, m.pos[0], m.pos[1]);
    const pos = new Float32Array(q.length);
    for (let i = 0; i < q.length; i++) pos[i] = meta.lo[i % 3] + q[i] / 65535 * size[i % 3];
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    geo.setIndex(new THREE.BufferAttribute(new Uint32Array(bytes.buffer, m.idx[0], m.idx[1]), 1));
    const [r, g, b, a] = m.color;
    const is = (cr, cg, cb) => Math.abs(r - cr) < 0.01 && Math.abs(g - cg) < 0.01 && Math.abs(b - cb) < 0.01;
    const mask = a < 1;  // the solder mask is the only see-through material KiCad exports
    const mat = new THREE.MeshStandardMaterial({ color: new THREE.Color(r, g, b), metalness: m.metal, roughness: m.rough,
                                                 flatShading: !mask, side: THREE.DoubleSide, envMapIntensity: LOOK.surroundings });
    // KiCad's export colours identify the board layers; parts keep the colours of their own models
    if (mask) Object.assign(mat, { color: new THREE.Color(...LOOK.mask), transparent: true, opacity: LOOK.maskOpacity,
                                   roughness: LOOK.maskRoughness, depthWrite: false });
    else if (is(0.42, 0.45, 0.29)) mat.color.setRGB(...LOOK.core);                                  // FR-4 core
    else if (is(0.7, 0.61, 0.0)) Object.assign(mat, { color: new THREE.Color(...LOOK.copper), roughness: LOOK.copperRoughness });  // copper under the mask
    else if (is(0.5, 0.5, 0.5) && m.metal === 1) Object.assign(mat, { color: new THREE.Color(LOOK.pad), envMapIntensity: 1 });   // exposed pads
    else if (is(0.96, 0.96, 0.96)) mat.color.set(LOOK.silk);                                       // silkscreen
    const mesh = new THREE.Mesh(geo, mat);
    if (mask) { geo.computeVertexNormals(); mesh.renderOrder = 1; }
    board.add(mesh);
  }
  // centre the board on the origin
  board.position.set(-(meta.lo[0] + meta.hi[0]) / 2, -(meta.lo[1] + meta.hi[1]) / 2, -(meta.lo[2] + meta.hi[2]) / 2);
  scene.add(board);

  const camera = new THREE.PerspectiveCamera(32, 1, 2, 600);
  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.minDistance = 25;
  controls.maxDistance = 260;
  controls.autoRotate = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  controls.autoRotateSpeed = 1.2;

  const views = { angle: [-40, 48, 52], top: [0, 86, 0.01], bottom: [0, -86, 0.01] };
  const setView = name => { camera.position.set(...views[name]); controls.target.set(0, 0, 0); controls.update(); };
  canvas.addEventListener("pointerdown", () => { controls.autoRotate = false; });
  window.addEventListener("keydown", e => {
    if (e.key === " ") { controls.autoRotate = !controls.autoRotate; e.preventDefault(); }
    const view = { 1: "angle", 2: "top", 3: "bottom" }[e.key];
    if (view) setView(view);
  });
  setView("angle");

  const resize = () => {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (canvas.width !== Math.round(w * renderer.getPixelRatio()) || canvas.height !== Math.round(h * renderer.getPixelRatio())) {
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
  };
  renderer.setAnimationLoop(() => { resize(); controls.update(); renderer.render(scene, camera); });
} catch (err) {
  document.body.append("Could not show the 3D view: " + err.message);
  console.error(err);
}
</script>
</body>
</html>
